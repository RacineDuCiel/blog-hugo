name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.170.0"
      HUGO_SHA256: "0930754ec22ad2dd1a252f8c31a5e57faccc9d15f1c3d381ddafcb96eeb8aef0"
      DART_SASS_VERSION: "1.108.2"
      DART_SASS_SHA256: "32d2eb5b83cbc180fce9657ff3c57401a9006c59eccfe0bfdde0aa755a66d42f"
    steps:
      - name: Install Hugo and Dart Sass
        run: |
          hugo_archive="$RUNNER_TEMP/hugo.tar.gz"
          sass_archive="$RUNNER_TEMP/dart-sass.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$hugo_archive" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$sass_archive" \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          printf '%s  %s\n' "$HUGO_SHA256" "$hugo_archive" "$DART_SASS_SHA256" "$sass_archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/hugo"
          tar -xzf "$hugo_archive" -C "$RUNNER_TEMP/hugo" hugo
          tar -xzf "$sass_archive" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/hugo" "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build with Hugo
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "https://racineduciel.fr/"

      - name: Validate generated pages
        run: python3 scripts/verify.py public

      - name: Validate personal fragments
        run: python3 scripts/test_fragments.py

      - name: Validate album collections
        run: python3 scripts/test_albums.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./public

  deploy:
    permissions:
      pages: write
      id-token: write
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1

