title = "RacineDuCiel"
baseURL = "https://racineduciel.fr/"
theme = "ablog"
enableGitInfo = true
enableEmoji = true
enableRobotsTXT = true

[pagination]
  pagerSize = 15
  path = "page"

defaultContentLanguage = "fr-fr"

[frontmatter]
  lastmod = [":git", ":fileModTime", "lastmod", "date"]

[taxonomies]
  theme = "themes"

[related]
  includeNewer = true

  [[related.indices]]
    name = "themes"
    weight = 100

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.extensions.typographer]
  disable = false

[markup.goldmark.extensions.extras.mark]
  enable = true

[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['$$', '$$'], ['\\[', '\\]']]
    inline = [['$', '$'], ['\\(', '\\)']]

[privacy.googleAnalytics]
  respectDoNotTrack = true

[privacy.youtube]
  privacyEnhanced = true

[sitemap]
  changefreq = "weekly"
  priority = 0.5

[params]
  showFooter = false
  browserconfig.TileColor = "#2d89ef"

[Languages.fr-fr]
  label = "French"
  locale = "fr-fr"
  contentDir = "content/"
  weight = 1

  [Languages.fr-fr.params]
    defaultColor = "auto"
    mainSections = ["posts"]
    toc = false
    goToTop = true
    dateFormat = "02/01/2006"
    rssFeedDescription = "summary"
    additionalScripts = []
    sitename = "RacineDuCiel"
    description = ""

    [Languages.fr-fr.params.author]
      avatar = "avatar.jpg"
      description = "What does it mean to be human... ?"
      name = "RacineDuCiel"

    [Languages.fr-fr.params.webmanifest]
      start_url = "/"
      theme_color = "#434648"
      background_color = "#fbfbfd"
      display = "standalone"

    [Languages.fr-fr.params.seo]
      images = ["og-image.jpg"]

   [[Languages.fr-fr.menu.main]]
    pageRef = "/"
    name = "Accueil"
    url = "/"
    weight = 10
  [[Languages.fr-fr.menu.main]]
    pageRef = "posts"
    name = "Articles"
    url = "/posts/"
    weight = 20
  [[Languages.fr-fr.menu.main]]
    pageRef = "about"
    name = "À propos"
    url = "/about/"
    weight = 40

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]

[[Languages.fr-fr.menu.main]]
  name = "Recherche"
  pageRef = "/search"
  weight = 35

