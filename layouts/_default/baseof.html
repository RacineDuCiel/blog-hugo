<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}">
{{ partial "head.html" . }}
<body{{ with .Params.pageClass }} class="{{ . }}"{{ end }}{{ if eq .Site.Params.showFooter false }} data-footer="hidden"{{ end }}>
<a class="skip-link" href="#main">Aller au contenu</a>
{{ partial "header.html" . }}
{{ block "main" . }}{{ end }}
{{ if ne .Site.Params.showFooter false }}{{ partial "footer.html" . }}{{ end }}
{{ partial "scriptsBodyEnd.html" . }}
</body>
</html>
