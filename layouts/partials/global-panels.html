<dialog class="global-dialog search-dialog" data-search-dialog aria-labelledby="global-search-title">
  <div class="dialog-header"><div><p class="eyebrow">Recherche</p><h2 id="global-search-title">Trouver un texte</h2></div><button type="button" data-dialog-close aria-label="Fermer la recherche">Fermer</button></div>
  {{ partial "search-interface.html" (dict "standalone" false) }}
</dialog>
<dialog class="global-dialog library-dialog" data-library-dialog aria-labelledby="library-title" aria-describedby="library-description">
  <div class="dialog-header"><div><p class="eyebrow">Privée et locale</p><h2 id="library-title">Bibliothèque</h2><p id="library-description">Vos textes enregistrés et votre historique, stockés uniquement sur cet appareil.</p></div><button type="button" data-dialog-close aria-label="Fermer la bibliothèque">Fermer</button></div>
  <div class="library-tabs" role="tablist" aria-label="Bibliothèque"><button type="button" role="tab" aria-selected="true" data-library-tab="saved">Enregistrés <span data-library-tab-count="saved">0</span></button><button type="button" role="tab" aria-selected="false" data-library-tab="recent">Historique <span data-library-tab-count="recent">0</span></button></div>
  <div class="library-list" data-library-list aria-live="polite"></div>
  <button class="library-clear" type="button" data-library-clear hidden>Effacer les textes enregistrés</button>
</dialog>
<div class="site-notice" role="status" aria-live="polite" data-site-notice hidden></div>
