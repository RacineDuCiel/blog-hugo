<article class="post-item">
<div class="post-item-main"><h2 class="post-item-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
{{ with .GetTerms "categories" }}<div class="post-item-category">{{ range . }}<a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ end }}</div>{{ end }}</div>
<div class="post-item-meta">
{{ if ne .Params.showDate false }}<time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format "02.01.2006" }}</time>{{ end }}
{{ if gt .ReadingTime 0 }}<span>{{ .ReadingTime }} min</span>{{ end }}
{{ if .Params.isStarred }}<span aria-label="Favori">☆</span>{{ end }}
</div>
</article>
