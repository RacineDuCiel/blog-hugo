<div class="reading-settings" data-reading-settings>
  <button type="button" class="reading-settings-toggle" id="reading-settings-toggle"
          popovertarget="reading-settings-panel" aria-haspopup="dialog" aria-expanded="false"
          aria-controls="reading-settings-panel" aria-label="Réglages de lecture">
    <span class="rs-toggle-glyph" aria-hidden="true">Aa</span>
    <span>Réglages</span>
  </button>

  <div class="reading-settings-panel" id="reading-settings-panel" popover="auto"
       role="dialog" aria-labelledby="reading-settings-title" hidden>
    <div class="rs-header">
      <h2 id="reading-settings-title">Réglages de lecture</h2>
      <button type="button" class="rs-close" aria-label="Fermer les réglages">Fermer</button>
    </div>
    <div class="rs-fields">
      <div>
        <div class="rs-range-heading">
          <label for="reading-size">Taille du texte</label>
          <output class="rs-range-value" for="reading-size">100&nbsp;%</output>
        </div>
        <div class="rs-size-controls">
          <button type="button" class="rs-btn" data-rs-size="dec"
                  aria-label="Diminuer la taille du texte" aria-controls="reading-size">A&minus;</button>
          <input class="rs-range" id="reading-size" data-rs-scale="reading-font-scale" type="range"
                 min="60" max="150" step="5" value="100" aria-valuetext="100 %">
          <button type="button" class="rs-btn" data-rs-size="inc"
                  aria-label="Augmenter la taille du texte" aria-controls="reading-size">A+</button>
        </div>
      </div>

      <div>
        <div class="rs-range-heading">
          <label for="reading-width">Largeur de lecture</label>
          <output class="rs-range-value" for="reading-width">100&nbsp;%</output>
        </div>
        <input class="rs-range" id="reading-width" data-rs-scale="reading-width-scale" type="range"
               min="75" max="115" step="5" value="100" aria-valuetext="100 %">
      </div>

      <label class="rs-font" for="reading-font">
        Police du texte
        <select id="reading-font">
          <option value="">Par défaut ({{ if eq .Params.pageClass "fiche-revision" }}Inter{{ else }}Source Serif{{ end }})</option>
          <option value="serif">Source Serif</option>
          <option value="inter">Inter</option>
          <option value="georgia">Georgia (sérif système)</option>
          <option value="atkinson">Atkinson Hyperlegible Next</option>
        </select>
      </label>

      <fieldset class="rs-spacing">
        <legend>Interligne</legend>
        <div class="rs-spacing-choices">
          <label>
            <input class="sr-only" type="radio" name="reading-spacing" value="compact">
            <span>Compact</span>
          </label>
          <label>
            <input class="sr-only" type="radio" name="reading-spacing" value="" checked>
            <span>Standard</span>
          </label>
          <label>
            <input class="sr-only" type="radio" name="reading-spacing" value="airy">
            <span>Aéré</span>
          </label>
        </div>
      </fieldset>

      <button type="button" class="rs-reset" data-rs-reset>Réinitialiser</button>
    </div>
  </div>
</div>
