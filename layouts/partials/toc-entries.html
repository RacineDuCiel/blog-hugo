{{ range . }}
{{ if .Title }}
{{ $title := .Title | plainify | htmlUnescape }}
<li class="toc-item">
  <a class="toc-link" href="#{{ .ID }}">{{ $title }}</a>
  {{ if .Headings }}
  <details class="toc-branch">
    <summary class="toc-disclosure" aria-label="Sous-sections de {{ $title }}"></summary>
    {{ partial "toc-level.html" .Headings }}
  </details>
  {{ end }}
</li>
{{ else }}{{ partial "toc-entries.html" .Headings }}{{ end }}
{{ end }}
