{{/*
Shortcode: Onion Rendezvous Protocol
Usage: {{< onion-rendezvous >}}
*/}}

{{ $id := printf "onion-rv-%d" .Ordinal }}

<section class="onion-rv" aria-labelledby="{{ $id }}-title">
    <header class="onion-rv__header">
        <p class="onion-rv__eyebrow">Service onion v3</p>
        <h3 id="{{ $id }}-title">Introduction et rendez-vous</h3>
    </header>

    <div class="onion-rv__nav" role="group" aria-label="Étapes du protocole de rendez-vous onion">
        <button type="button" data-step="1" class="active" aria-current="step" aria-controls="{{ $id }}-desc">
            <span>1</span>
            <strong>Publier</strong>
        </button>
        <button type="button" data-step="2" aria-controls="{{ $id }}-desc">
            <span>2</span>
            <strong>Trouver</strong>
        </button>
        <button type="button" data-step="3" aria-controls="{{ $id }}-desc">
            <span>3</span>
            <strong>Préparer</strong>
        </button>
        <button type="button" data-step="4" aria-controls="{{ $id }}-desc">
            <span>4</span>
            <strong>Introduire</strong>
        </button>
        <button type="button" data-step="5" aria-controls="{{ $id }}-desc">
            <span>5</span>
            <strong>Joindre</strong>
        </button>
        <button type="button" data-step="6" aria-controls="{{ $id }}-desc">
            <span>6</span>
            <strong>Relayer</strong>
        </button>
    </div>

    <div class="onion-rv__stage">
        <svg class="onion-rv__diagram" viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg"
             role="img" aria-labelledby="{{ $id }}-svg-title {{ $id }}-svg-desc">
            <title id="{{ $id }}-svg-title">Schéma du protocole de rendez-vous onion v3</title>
            <desc id="{{ $id }}-svg-desc">Le service publie un descripteur chiffré, le client récupère ce descripteur, prépare un rendez-vous, contacte un point d'introduction, puis les deux circuits sont reliés par un point de rendez-vous.</desc>

            <defs>
                <marker id="{{ $id }}-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
                    <path d="M 0 0 L 9 4.5 L 0 9 z" class="onion-rv__marker" />
                </marker>
            </defs>

            <path class="onion-rv__flow" data-flow="1" d="M 190 114 C 250 70 295 58 338 70" marker-end="url(#{{ $id }}-arrow)" />
            <path class="onion-rv__flow" data-flow="1" d="M 190 156 C 238 225 286 250 342 250" marker-end="url(#{{ $id }}-arrow)" />
            <path class="onion-rv__flow" data-flow="2" d="M 530 118 C 470 72 424 58 382 70" marker-end="url(#{{ $id }}-arrow)" />
            <path class="onion-rv__flow" data-flow="3" d="M 530 150 C 474 178 432 180 392 180" marker-end="url(#{{ $id }}-arrow)" />
            <path class="onion-rv__flow" data-flow="4" d="M 530 190 C 470 238 425 252 378 250" marker-end="url(#{{ $id }}-arrow)" />
            <path class="onion-rv__flow" data-flow="4" d="M 342 250 C 270 252 215 218 184 166" marker-end="url(#{{ $id }}-arrow)" />
            <path class="onion-rv__flow" data-flow="5" d="M 190 180 C 250 184 294 184 328 184" marker-end="url(#{{ $id }}-arrow)" />
            <path class="onion-rv__flow onion-rv__flow--data" data-flow="6" d="M 190 174 C 250 144 300 146 332 168" marker-end="url(#{{ $id }}-arrow)" />
            <path class="onion-rv__flow onion-rv__flow--data" data-flow="6" d="M 388 168 C 422 146 474 144 530 174" marker-end="url(#{{ $id }}-arrow)" />

            <g class="onion-rv__actor" data-actor="service" transform="translate(70 112)">
                <rect width="120" height="76" rx="8" />
                <text x="60" y="34">Service</text>
                <text x="60" y="54">onion</text>
            </g>

            <g class="onion-rv__actor" data-actor="hsdir" transform="translate(320 40)">
                <rect width="80" height="62" rx="8" />
                <text x="40" y="38">HSDir</text>
            </g>

            <g class="onion-rv__actor" data-actor="ip" transform="translate(300 222)">
                <rect width="120" height="62" rx="8" />
                <text x="60" y="31">Intro</text>
                <text x="60" y="49">Point</text>
            </g>

            <g class="onion-rv__actor" data-actor="rp" transform="translate(320 148)">
                <rect width="80" height="64" rx="8" />
                <text x="40" y="30">Rendez-</text>
                <text x="40" y="48">vous</text>
            </g>

            <g class="onion-rv__actor" data-actor="client" transform="translate(530 112)">
                <rect width="120" height="76" rx="8" />
                <text x="60" y="42">Client</text>
            </g>
        </svg>

        <div class="onion-rv__desc" id="{{ $id }}-desc" aria-live="polite"></div>
    </div>
</section>

{{ $onionScript := resources.Get "js/onion-rendezvous.js" | minify | fingerprint }}
<script defer src="{{ $onionScript.RelPermalink }}" integrity="{{ $onionScript.Data.Integrity }}" crossorigin="anonymous"></script>
