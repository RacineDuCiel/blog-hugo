{{ define "main" }}
{{ $paginator := .Paginate .RegularPages.ByDate.Reverse }}
<main id="main-content" class="listing-page editorial-shell"><header class="listing-hero"><h1>{{ .Title }}</h1></header><div class="story-list">{{ range $paginator.Pages }}{{ partial "postCard" (dict "page" .) }}{{ end }}</div>{{ partial "pagination.html" $paginator }}</main>
{{ end }}
